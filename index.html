<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F7B5F">
<title>ניהול לקוחות</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #F4F6F5; --surface: #FFFFFF; --ink: #17201C; --ink2: #3C4A44; --muted: #6B7A73; --line: #E1E7E4;
  --accent: #0F7B5F; --accent-soft: #E3F2EC; --on-accent: #FFFFFF; --danger: #C2412D; --danger-soft: #FBE9E5;
  --warn: #B7791F; --warn-soft: #FDF3E1; --wa: #25A244; --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #101614; --surface: #19211E; --ink: #E8EEEB; --ink2: #C3CEC9; --muted: #8A9A93; --line: #2A3531;
          --accent: #2FB38C; --accent-soft: #173229; --on-accent: #0B1411; --danger: #F07560; --danger-soft: #3A1E19;
          --warn: #E3A64B; --warn-soft: #362A15; --shadow: none; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, "Segoe UI", Roboto, Heebo, Arial, sans-serif; }
body { padding-bottom: calc(68px + env(safe-area-inset-bottom)); min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.top { position: sticky; top: 0; z-index: 5; background: var(--accent); color: var(--on-accent); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 18px; margin: 0; flex: 1; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .back { background: none; border: 0; color: inherit; font-size: 22px; padding: 4px 6px; margin: -4px 0; }
.sync-btn { background: rgba(255,255,255,.16); border: 0; color: inherit; border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.wrap { padding: 12px 16px 24px; max-width: 760px; margin: 0 auto; }
.search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); margin: 4px 0 10px; outline: none; }
.search:focus { border-color: var(--accent); }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); margin: 10px 0; overflow: hidden; }
.card h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0; padding: 12px 14px 4px; letter-spacing: .02em; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); min-height: 52px; }
.card h2 + .row, .card > .row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s.wrap-text { white-space: pre-wrap; overflow: visible; }
.row.tap:active { background: var(--accent-soft); }
.chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip.red { background: var(--danger-soft); color: var(--danger); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.btn { text-decoration: none; border: 0; border-radius: 12px; padding: 10px 14px; background: var(--accent-soft); color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.btn.solid { background: var(--accent); color: var(--on-accent); }
.btn.wa { background: var(--wa); color: #fff; }
.btn.red { background: var(--danger-soft); color: var(--danger); }
.btn.small { padding: 6px 10px; font-size: 13.5px; border-radius: 10px; }
.btn.block { width: 100%; padding: 13px; }
.btn:disabled { opacity: .5; }
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px; margin: 10px 0; }
.actions .btn { flex-direction: column; padding: 10px 6px; font-size: 13px; gap: 4px; }
.actions .btn .i { font-size: 20px; }
.ltr { direction: ltr; unicode-bidi: embed; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .02em; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.nav a { flex: 1; text-align: center; padding: 8px 0 9px; color: var(--muted); text-decoration: none; font-size: 12px; position: relative; }
.nav a .i { display: block; font-size: 21px; line-height: 1.2; }
.nav a.on { color: var(--accent); font-weight: 650; }
.nav .badge { position: absolute; top: 4px; margin-right: 14px; background: var(--danger); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; font-weight: 700; }
.fab { position: fixed; z-index: 6; left: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 650; padding: 14px 18px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 760px; border-radius: 18px 18px 0 0; max-height: 92vh; overflow: auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet h3 { margin: 0 0 12px; font-size: 18px; }
label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
.in, textarea.in, select.in { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); outline: none; }
.in:focus { border-color: var(--accent); }
textarea.in { min-height: 96px; resize: vertical; }
.seg { display: flex; background: var(--bg); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px; border-radius: 9px; color: var(--ink2); font-weight: 600; }
.seg button.on { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.btns { display: flex; gap: 8px; margin-top: 16px; }
.btns .btn { flex: 1; padding: 13px; }
.toast { position: fixed; z-index: 30; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); background: #1F2925; color: #fff; padding: 12px 14px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); display: flex; gap: 10px; align-items: center; max-width: 728px; margin: 0 auto; }
.toast .btn { background: rgba(255,255,255,.14); color: #fff; }
.empty { text-align: center; color: var(--muted); padding: 30px 16px; }
.hero { text-align: center; padding: 34px 18px 10px; }
.hero .logo { width: 72px; height: 72px; border-radius: 20px; }
.hero h2 { margin: 14px 0 6px; font-size: 22px; }
.hero p { color: var(--muted); margin: 0 auto; max-width: 420px; }
.pw { cursor: pointer; }
.banner { background: var(--warn-soft); color: var(--warn); padding: 10px 14px; border-radius: 12px; margin: 8px 0; font-size: 14px; display: flex; gap: 10px; align-items: center; }
.banner.red { background: var(--danger-soft); color: var(--danger); }
.pin { display: flex; gap: 10px; justify-content: center; margin: 18px 0; }
.pin input { width: 200px; text-align: center; font-size: 24px; letter-spacing: 10px; }
.spin { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hint { color: var(--muted); font-size: 13.5px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="sdcrypto.js"></script>
<script src="app.js"></script>
</body>
</html>
